<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Une Journée d'Olha - TCF A2</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-chap1: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%); /* Matin clair */
            --bg-chap2: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%); /* Ville/Journée */
            --bg-chap3: linear-gradient(135deg, #2c3e50 0%, #fd746c 100%); /* Soir chaleureux */
            --bubble-npc: #ffffff;
            --bubble-player: #4CAF50;
            --bubble-player-hover: #45a049;
        }

        body {
            font-family: 'Nunito', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.8s ease-in-out;
            background: var(--bg-chap1);
            color: #333;
        }

        /* Classes de fond dynamique gérées par JS */
        body.chap1 { background: var(--bg-chap1); }
        body.chap2 { background: var(--bg-chap2); }
        body.chap3 { background: var(--bg-chap3); }

        #game-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            box-sizing: border-box;
            width: 100%;
        }

        .header {
            text-align: center;
            padding: 10px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .header h1 {
            margin: 0;
            font-size: 1.2em;
            color: #2c3e50;
        }

        .chapter-title {
            font-size: 0.9em;
            color: #555;
            font-weight: bold;
        }

        .scene {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            gap: 20px;
            padding-bottom: 20px;
        }

        /* Bulle du PNJ (Personnage Non Joueur) */
        .npc-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            animation: fadeIn 0.5s ease-out;
        }

        .npc-name {
            font-weight: bold;
            margin-bottom: 5px;
            margin-left: 15px;
            color: #2c3e50;
            background: rgba(255, 255, 255, 0.7);
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 0.9em;
        }

        .bubble-npc {
            background: var(--bubble-npc);
            padding: 15px 20px;
            border-radius: 20px;
            border-bottom-left-radius: 5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 85%;
            position: relative;
        }

        /* Choix du joueur (Olha) */
        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            margin-top: 20px;
        }

        .choice-btn {
            background: var(--bubble-player);
            color: white;
            border: none;
            padding: 15px 20px;
            border-radius: 20px;
            border-bottom-right-radius: 5px;
            text-align: right;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.2s, background 0.2s;
            animation: slideUp 0.5s ease-out;
            align-self: flex-end;
            max-width: 90%;
        }

        .choice-btn:active {
            transform: scale(0.98);
            background: var(--bubble-player-hover);
        }

        /* Typographie bilingue */
        .fr-text {
            font-size: 1.1em;
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
        }

        .uk-text {
            font-size: 0.85em;
            color: rgba(0, 0, 0, 0.6);
            font-style: italic;
            display: block;
        }

        .choice-btn .uk-text {
            color: rgba(255, 255, 255, 0.8);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>

        const sceneEl = document.getElementById('scene');
    const bodyEl = document.getElementById('body');
    const chapterTitleEl = document.getElementById('chapter-title');

    // Fonction de synthèse vocale
    function lireTexte(texte) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); // Coupe l'audio précédent si on clique vite
            const utterance = new SpeechSynthesisUtterance(texte);
            utterance.lang = 'fr-FR'; 
            utterance.rate = 0.85; // Débit ralenti pour faciliter la compréhension A2
            window.speechSynthesis.speak(utterance);
        }
    }

    function loadNode(nodeId) {
        const node = story[nodeId];
        
        bodyEl.className = 'chap' + node.chapter;
        chapterTitleEl.innerText = node.chapTitle;
        sceneEl.innerHTML = '';

        const npcContainer = document.createElement('div');
        npcContainer.className = 'npc-container';
        
        const npcName = document.createElement('div');
        npcName.className = 'npc-name';
        npcName.innerText = node.npc;

        const npcBubble = document.createElement('div');
        npcBubble.className = 'bubble-npc';
        npcBubble.style.cursor = 'pointer'; 
        
        // Déclenche la voix au clic sur la bulle du personnage
        npcBubble.onclick = () => lireTexte(node.fr); 
        
        npcBubble.innerHTML = `
            <span class="fr-text">🔊 ${node.fr}</span>
            <span class="uk-text">${node.uk}</span>
        `;

        npcContainer.appendChild(npcName);
        npcContainer.appendChild(npcBubble);
        sceneEl.appendChild(npcContainer);

        const choicesContainer = document.createElement('div');
        choicesContainer.className = 'choices-container';

        node.choices.forEach(choice => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            
            btn.innerHTML = `
                <span class="fr-text">🔊 ${choice.fr}</span>
                <span class="uk-text">${choice.uk}</span>
            `;
            
            btn.onclick = () => {
                lireTexte(choice.fr); // Lit la réponse choisie par Olha
                
                // Délai de 600ms pour laisser la voix démarrer avant d'afficher la suite
                setTimeout(() => { 
                    if(choice.next) loadNode(choice.next); 
                }, 600); 
            };
            choicesContainer.appendChild(btn);
        });

        sceneEl.appendChild(choicesContainer);
    }

    window.onload = () => loadNode("1.1");
    </script>
</body>
</html>
